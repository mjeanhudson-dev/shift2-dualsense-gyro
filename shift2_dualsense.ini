; Settings for the DualSense XInput proxy. Put this file next to xinput1_3.dll.
; Changes apply the next time the game starts.
;
; CONTROLS WHILE PLAYING
;   Controller Tilt/Gyro ... linked directly to Left Stick X (turn controller like a steering wheel)
;   Mute button ............ motion steering on/off (and re-center); the Mic LED shows when it is on
;   PS button .............. re-center + Reset Car in Shift 2 (with Cyan flash and haptic tap)
;   Gear Shifts ............ Circle (Xbox B) = Shift Up, Square (Xbox X) = Shift Down (proxy steps virtual tachometer & haptic shift clunk).
;                            If you turned on the game's "Inverse Shifting", set [Tach] InverseShift=1 to match.
;   Clutch ................. Left Bumper (L1 / LB) = Clutch (virtual tachometer free-revs with throttle).
;   Handbrake .............. Cross ('X' symbol / Xbox A / bottom button) = Primary Handbrake; L3 (Left Stick click) = Alternate Handbrake.
;   Trackpad flick ......... swipe across touchpad (no click) to glance camera into corner/apex, side mirrors, or rearview

; SETTINGS TO USE INSIDE SHIFT 2 (Options > Controller > Advanced) WHEN THIS PROXY IS ACTIVE
;   Steering Deadzone ....... 0-4%  (GameDeadzone=4 below lifts initial input cleanly to match the game's 3.75% deadzone)
;   Steering Sensitivity .... 50%   (50% is stock; use [Handling] Curve or [Motion] Curve to reshape if desired)
;   Speed Steering Sensitivity ... leave this ON/high for a gamepad. The game knows your real speed; the proxy does not.
;   Accelerator / Brake deadzones and sensitivity ... your taste; the proxy does not touch them.
;   Natural Steering Feel ... ENABLED in game XMLs (DampeningEnabled="1") and paired with Lead=0 and Smoothing=50
;                             for progressive asymmetric weighted rack dampening, eliminating twitchiness while retaining precision.

[Controls]
; 1 = Heavy racing trigger effects, ABS judder, and shift kicks engage while actively racing/driving.
; In menus and car selection, gentle cushioned triggers and subtle button micro-haptics are active.
; Motion steering is independent and functions smoothly whenever motion is turned on.
InRaceOnly=1
; Milliseconds of driving inactivity (no pedals, no game rumble) before returning to menu mode.
TimeoutMs=4000
InactivityTimeoutMs=4000
; Physical PlayStation Cross button ('X' symbol / Xbox A) is mapped directly as Shift 2's primary Handbrake.
; 1 = clicking Left Stick (L3) also sends Xbox A button (Handbrake) in race; standard L3 in menus.
; Provides dual handbrake controls without needing in-game controller menu rebinding.
L3Handbrake=1
; 0 = PlayStation Square (Xbox X) stays independent as Shift Down / Downgear (while Cross / Xbox A is Handbrake).
; 1 = Both PlayStation Cross (Xbox A) and PlayStation Square (Xbox X) act as Handbrake (Xbox A) in race.
XHandbrake=0
; 1 = PS button sends Xbox Back (Reset Car in Shift 2) + re-centers motion steering.
; 2 = PS button sends Xbox Start (Pause Menu). 0 = internal re-center only.
PSButton=1

[MenuHaptics]
; Subtle, less intense vibration and tactile feedback set for menus previous to race start.
; In menus, button presses (D-pad navigation, A, B, X, Y, LB, RB, trigger pulls) produce crisp, subtle micro-haptic clicks.
ButtonVibe=1
; Power of the menu button tactile clicks (1-255). 55 provides a gentle micro-tap (compared to 180 race kick).
ButtonPower=55
; Duration of the menu button click in milliseconds (10-100 ms). 25 ms is crisp and subtle.
ButtonMs=25
; Menu adaptive trigger mode:
; 0 = no resistance in menus (standard soft stock trigger, eliminates heavy race brake feel in menus).
; 1 = subtle, light cushioned resistance (level 1-2, refined mechanical feel).
; 2 = soft trigger pulse.
; Note: A 15-count deadzone is enforced on L2 in menus to eliminate resting finger bleed (7-12 counts).
TriggerMode=0
; Trigger resistance level in menus (1-8). 1 = very light and gentle.
TriggerStrength=1
; Trigger zone where resistance begins (0-9). 0 = starts immediately on trigger pull.
TriggerZone=0

[Motion]
; 1 = motion steering already on when the game starts, 0 = off until Mute toggles it on.
StartEnabled=1
; Links 3D gyroscope + accelerometer directly to Left Stick X so you can turn the controller like a steering wheel.
; Roll gyro gives immediate motion response; sagittal-plane gravity anchors the center across any grip pitch angle.
; Press PS to re-center; Mute toggles motion and centers. Touchpad swipes only glance.
; 0 = 1st-Party Player Space (Unified Player Turn & Lean Auto-Blend with C2 Smootherstep);
;     Automatically and seamlessly handles both steering wheel roll and flat/turntable yaw across any recline angle (0-90 deg).
; 1 = Turntable / Flat Yaw steering mode (prioritizes horizontal yaw with 35% roll assist across any pitch angle).
; 2 = Sagittal Wheel Roll steering mode (prioritizes steering-wheel roll tilt with 35% yaw assist across any pitch angle).
Mode=0
; Set to 1 if turning the pad right steers left. (The player LEDs show which way it thinks you are steering.)
Invert=0
; Degrees of steering-wheel tilt for full steering lock (28 degrees provides heightened gyro sensitivity and effortless steering range with zero wrist strain).
MaxAngle=28
; Degrees of tilt ignored around center (1 = 0.65 deg micro-breakaway threshold for immediate turning recognition).
Deadzone=1
; 100 = linear; >100 = softer near center, <100 = sharper/more responsive near center (95 boosts off-center gyro sensitivity).
Curve=95
; Progressive asymmetric weighted rack dampening & input lag reintegration on our end:
; 100 or 0 = direct 1:1 passthrough (zero proxy delay, raw steering wheel response).
; 55  = crisp, responsive steering wheel rack inertia and subtle dampening.
; 75  = heavier steering wheel rack inertia and dampening.
Smoothing=55
; Casiez et al. 1€ Filter (One Euro Filter) adaptive jitter reduction:
; Minimum cutoff frequency in hundredths of Hz (120 = 1.20 Hz). Clamps resting tremor on straights.
OneEuroMinCutoff=120
; Speed coefficient in thousandths (55 = 0.055). Higher values increase immediate gyro turn recognition.
OneEuroBeta=55
; Calibrated zero-rate gyroscope bias offsets (deg/s):
GyroBiasX=0
GyroBiasY=0
GyroBiasZ=0


[Triggers]
; 0 turns all adaptive trigger effects off.
Enabled=1
; Brake = L2, Throttle = R2.
; Zone: 0-9, how far into the pull the resistance starts (higher = later).
; Strength: 0-8, stiffness where the resistance starts (0 = no resistance).
; EndStrength: 0-8, stiffness at the bottom of the pull. Higher than Strength = a progressive pedal
; that stiffens as you push (like a real spring). 0 = same as Strength all the way (flat).
BrakeZone=2
BrakeStrength=3
BrakeEndStrength=7
ThrottleZone=0
ThrottleStrength=1
ThrottleEndStrength=1
; 1 = the game's rumble also makes the triggers vibrate (heavy motor -> L2, light motor -> R2).
RumbleToTriggers=1
; 0-255. Rumble weaker than this is ignored by the trigger vibration. (No rumble at all is never treated as rumble,
; even at 0.)
RumbleThreshold=40
; Vibration speed in Hz.
BrakeFrequency=30
ThrottleFrequency=40
; 0-8. Maximum vibration allowed on R2. Set to 0 to completely eliminate all pulsing/buzzing on R2, keeping a silky-smooth constant resistance.
ThrottleVibeMax=0

[Abs]
; ABS judder: when you pull L2 past Threshold, the trigger flips from resistance to a hard judder
; in the last part of its travel, like a brake pedal fighting back at the limit. It is driven by
; how hard you pull, not by the game, so it happens on every full brake. The light bar flashes
; amber/red while it is active.
Enabled=1
; 100-255. Pull depth (255 = fully pulled) where the judder starts. 215 is about 85%.
Threshold=215
; How far you must ease off below Threshold before it stops (prevents flicker at the edge). It always stops
; when the trigger is fully released, whatever you set here.
Release=20
; Judder speed in Hz, and strength 1-8.
Frequency=40
Strength=8

[Grip]
; Grip circle: the more steering lock you apply (stick or tilt), the heavier R2 gets, so the pedal
; asks you to be gentle when the wheel is cocked.
Enabled=1
; 0-7. Extra throttle stiffness at full steering lock.
Boost=3

[Haptics]
; Short rumble kick when you tap a bumper, when the virtual tach auto-shifts, and when ABS engages.
ShiftKick=1
AbsThump=1
; 0-255 strength and 10-500 length in milliseconds.
KickPower=180
KickMs=70
; Steering-lock thunk: 0 = disabled (smooth seamless lock with no artificial kick); 1 = kick at full lock.
LockKick=0
LockPower=130

[Crash]
; Crash shock: a sudden hard rumble spike from the game (a collision) slams BOTH triggers and both
; motors, and flashes the light bar white/red.
Enabled=1
; 50-255. The new rumble must be at least this strong...
Threshold=200
; 20-255. ...and have jumped up by at least this much in one step.
Jump=120
; 100-3000. How long the shock lasts, in milliseconds.
Ms=600
; Trigger judder speed in Hz.
Frequency=50

[Tach]
; Virtual tach: an ESTIMATED engine speed worked out from your throttle, brake and shifts. It is NOT
; read from the game. It colours the light bar (blue idle -> green -> yellow -> red) and decides when
; the shift-light strobe and limiter buzz fire.
Enabled=1
; 70-99. Percent of the rev range where the shift-light strobe and limiter buzz start.
Redline=93
; 0 = stays pinned smoothly until you tap Circle (no automated redline thumps).
AutoShift=0
; 1 = shift buttons swapped (Square up, Circle down). Use this if you switched on "Inverse Shifting" in the game's
; controller options, so the tach follows the same buttons as the game.
InverseShift=0

[Limiter]
; Limiter buzz: 0 = disabled (no pulsing/chatter on R2 at redline), 1 = enabled (the throttle chatters at redline).
Enabled=0
; Zone 0-9 where the buzz starts, strength 1-8, speed in Hz.
Zone=8
Strength=3
Frequency=25

[Flick]
; Fast motion / controller flick vibration feedback:
; 1 = Moving or flicking the controller quickly (sagittal wrist pitch snap) triggers a tactile haptic vibration pulse in both motors.
; Gives dynamic tactile motion feedback without pulling any buttons.
Enabled=1
; Degrees per second of rotation needed (100-2000). 340 responds to deliberate fast flicks without
; firing during normal cornering steering-wheel turns.
Threshold=340
; Length of the vibration pulse in milliseconds (30-500 ms).
Ms=90
; Lockout in milliseconds before another flick vibration can fire (50-3000 ms).
Lockout=400
; Optional button pulse (-1 = vibration only, 0=L3 1=R3 2=A 3=B 4=X 5=Y 6=LB 7=RB 8=Back 9=Start).
Button=-1

[Touch]
; DualSense Touchpad / Trackpad flick camera glance (Chase & Cockpit corner glance):
; 1 = Swiping or flicking across the trackpad snaps the camera look into the corner or rearview,
; held for 750 ms so Shift 2's 500 ms camera rise damping can fully animate and hold.
; - Flick left/right: purely deflects Right Stick rx (+/- 32767) decoupled from XB_R3 for smooth analog corner look.
; - Diagonal flick (up-left / up-right): angles view into corner apex (rx + ry) purely on analog axes.
; - Flick down: injects native Shift 2 Look Behind (XB_Y) instead of looking down at the cockpit floor.
; - Flick up: looks up into high cockpit (ry = +32767).
; - Resting or lightly brushing the pad does not shift camera. Clicks do not conflict with swipes.
Glance=1
; Look strength (10-100). 100 = full Right Stick deflection into the corner.
Strength=100
; Swipe gesture distance threshold (4-40, in tens of touchpad pixels; 12 = 120 px).
Deadzone=12

[LightBar]
; 1 = the proxy drives the light bar. Warning effects override the steady base colour:
;   ignition rainbow at connect > crash (white/red) > ABS (amber/red) > handbrake flick (magenta/cyan)
;   > redline shift light (white/blue) > tach gradient when Telemetry=1.
StatusLight=1
; 0 = steady BaseRed/BaseGreen/BaseBlue outside warning effects; 1 = tach gradient with brake overlay.
Telemetry=0
; 1 = warning lights flash; 0 = they stay solid on their first colour.
Strobe=1
; Flashes per second, 1-10.
StrobeHz=10
; 1 = ignition sequence (rainbow, LED chase, engine-start kick) when the pad connects.
Boot=0
; 1 = player LEDs show steering position while motion steering is on (centre LED only when it is off).
PlayerLeds=1
; 1 = the physical Mute/Mic LED lights while motion steering is ON (syncs with Mute button toggle).
MicLed=1
; Set to 1 if the player LEDs point the wrong way.
LedFlip=0
; Steady light-bar base colour when Telemetry=0. Default violet/purple.
BaseRed=128
BaseGreen=0
BaseBlue=255

[Lean]
; Lean-to-look: lean the pad forward/back to move the right stick Y (camera look up/down).
; PS or Mute button re-centers pitch along with steering.
StartEnabled=0
; Set to 1 if leaning forward looks the wrong way.
Invert=0
; Degrees of lean for full stick, and degrees ignored around center.
MaxAngle=25
Deadzone=3
; Percent of full stick (100 = full deflection at MaxAngle).
Strength=100

[SteeringVibe]
; Dynamic steering vibration / rumble on a sliding scale tied to instantaneous steering input.
; Only active during racing/driving (never vibrates in menus).
Enabled=1
; Maximum motor vibration power in percent (1-75%). Strictly capped at 75% max power.
; 60% gives rich, progressive road & tyre feedback at full steering lock without reaching 100%.
MaxPower=60
; Steering deadzone in percent (0-30%) before vibration begins.
Deadzone=5
; Response curve (50-200). 100 = linear progressive scale.
; >100 = gentler rumble on slight turn-in, escalating into tight hairpins.
; <100 = stronger rumble earlier in the steering travel.
Curve=100
; Directional motor routing:
; 1 = left turn vibrates left motor, right turn vibrates right motor.
; 0 = both motors vibrate equally regardless of turn direction.
Directional=1

[Handling]
; 1 = Spoof XINPUT_DEVSUBTYPE_WHEEL (0x02) in XInputGetCapabilities.
SpoofWheel=1
; 1 = Steering shaping and deadzone lift for Shift 2's controller model.
; 0 = Direct uncompensated passthrough.
Enabled=1
; Steering dead zone in percent of stick travel.
StickDeadzone=3
; Percent. Lifts the first bit of steering movement just above Shift 2's built-in 3.75% TurnDeadzone.
GameDeadzone=4
; 100 = linear, >100 = softer near center (fine control on straights), <100 = sharper near center.
Curve=100
; 60-100. Percent of stick travel that counts as full lock. Below 100 means full lock is reached before the
; stick's physical limit (round stick gates rarely reach the corners).
Saturation=97
; Lead compensation: 0 = disabled (smooth progressive steering without overshoot).
Lead=0
; 5-200 ms. Look-back time window for velocity lead calculation.
LeadMs=35
; Friction circle: 0 = disabled (smooth throttle through turns); 1 = cut throttle at full lock.
Traction=0
TractionCut=15

[Latency]
; 1 = the pad-reading thread runs at high priority (and requests Windows "Games" scheduling if available).
; The game's own process priority is never changed.
ThreadBoost=1

[Debug]
; 1 = write shift2_dualsense.log next to the DLL (or into %TEMP% if that folder is read-only).
; Useful while testing: it shows whether the game loaded the proxy, which XInput calls it makes,
; and whether the pad accepted the trigger/rumble/light-bar commands.
Log=1
